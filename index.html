<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F5EC">
<title>AI 理財助理使用體驗研究</title>
<style>/* ============================================================
   行動銀行 — Design Tokens & Global Styles
   ============================================================ */
:root {
  /* Brand — sunrise orange */
  --brand:        #144419;
  --brand-deep:   #144419;
  --brand-press:  #0F3317;
  --brand-tint:   #F1F5EC;
  --brand-tint-2: #E4EADB;

  /* Ink */
  --ink:    #1A1A1F;
  --ink-2:  #55555E;
  --ink-3:  #8B8B95;
  --ink-4:  #B4B4BD;

  /* Surfaces */
  --bg:     #FFFFFF;   /* warm app background */
  --card:   #FFFFFF;
  --line:   #F1F5EC;
  --line-2: #F1F5EC;

  /* Status colors */
  --success: #138A4E;
  --success-tint: #E6F4EC;
  --danger:  #D1372C;
  --danger-tint: #FBEAE8;
  --info:    #1F6FEB;
  --info-tint: #E9F1FE;
  --gold:    #B98A2E;

  /* Radii */
  --r-card: 22px;
  --r-md:   16px;
  --r-sm:   12px;
  --r-btn:  14px;

  /* Shadow */
  --sh-1: 0 1px 2px rgba(26,26,31,.04), 0 1px 3px rgba(26,26,31,.06);
  --sh-2: 0 4px 14px rgba(26,26,31,.07), 0 2px 6px rgba(26,26,31,.05);
  --sh-3: 0 12px 40px rgba(26,26,31,.16), 0 4px 12px rgba(26,26,31,.10);
  --sh-brand: 0 8px 22px rgba(20,68,25,.30);

  --font-zh: "Noto Sans TC", system-ui, sans-serif;
  --font-num: "Sora", "Noto Sans TC", system-ui, sans-serif;

  --phone-w: 390px;
  --phone-h: 844px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* iOS WebKit gives <button>/<input> text the system accent (blue) by default —
   force form controls & links to inherit the page ink color instead. */
button, input, select, textarea, a {
  color: inherit;
  -webkit-text-fill-color: currentColor;
}
a { text-decoration: none; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-zh);
  background:
    radial-gradient(120% 80% at 50% -10%, #FFFFFF 0%, #EFEDE8 42%, #E7E5DF 100%);
  background-attachment: fixed;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#root { width: 100%; display: flex; align-items: center; justify-content: center; }

/* ---------- Phone shell ---------- */
.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: 100vh;
  background: var(--bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
@media (min-width: 480px) and (min-height: 880px) {
  .phone {
    border-radius: 44px;
    box-shadow: var(--sh-3), 0 0 0 1px rgba(0,0,0,.04);
    outline: 9px solid #111114;
    outline-offset: -1px;
  }
}
/* fill viewport on real phones */
@media (max-width: 479px), (max-height: 879px) {
  body { display: block; overflow: auto; }
  .phone {
    width: 100vw;
    height: 100dvh;
    max-height: none;
  }
}

/* ---------- Status bar ---------- */
.statusbar {
  flex: 0 0 auto;
  height: 52px;
  padding: 0 26px 0 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .2px;
  color: var(--ink);
  z-index: 60;
  position: relative;
}
.statusbar.on-brand { color: #fff; }
.statusbar .sb-time { font-variant-numeric: tabular-nums; }
.statusbar .sb-right { display: flex; align-items: center; gap: 7px; }

/* ---------- Scroll body ---------- */
.screen-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.screen-scroll::-webkit-scrollbar { width: 0; height: 0; }
/* reserve space for the bottom tab bar on root screens */
.root-base .screen-scroll { padding-bottom: 92px; }

/* ---------- Bottom tab bar ---------- */
.tabbar {
  flex: 0 0 auto;
  height: 84px;
  padding: 8px 8px 22px;
  background: rgba(255,255,255,.92);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 50;
}
.tab {
  appearance: none;
  border: 0; background: none;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; cursor: pointer;
  color: var(--ink-4);
  font-family: var(--font-zh);
  font-size: 11px; font-weight: 600;
  transition: color .15s;
}
.tab.active { color: var(--brand); }
.tab svg { width: 25px; height: 25px; }

/* ---------- Home indicator ---------- */
.home-indicator {
  position: absolute; bottom: 8px; left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px;
  background: rgba(26,26,31,.28); z-index: 70; pointer-events: none;
}

/* ============================================================
   Reusable building blocks
   ============================================================ */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font-family: var(--font-zh); font-weight: 700;
  border-radius: var(--r-btn);
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; transition: transform .12s, box-shadow .2s, background .2s;
}
.btn:active { transform: scale(.975); }
.btn-primary {
  background: var(--brand); color: #fff;
  height: 54px; font-size: 17px; width: 100%;
  box-shadow: var(--sh-brand);
}
.btn-primary:disabled { background: #E4D9CF; color:#fff; box-shadow:none; cursor: not-allowed; }
.btn-ghost {
  background: var(--brand-tint); color: var(--brand-deep);
  height: 54px; font-size: 17px; width: 100%;
}
.btn-line {
  background: #FCFCFA; color: var(--ink); border: 1.5px solid var(--line);
  height: 54px; font-size: 17px; width: 100%;
}

.card {
  background: var(--card);
  border-radius: var(--r-card);
  box-shadow: var(--sh-1);
}

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; line-height: 1;
}

/* Section title */
.sec-title {
  font-size: 17px; font-weight: 800; color: var(--ink);
  letter-spacing: .2px;
}
.sec-link { font-size: 13.5px; font-weight: 600; color: var(--ink-3); }

/* List row */
.lrow {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 18px; cursor: pointer;
  background: #FCFCFA; position: relative;
}
.lrow:active { background: #FAF8F5; }
.lrow + .lrow::before {
  content:""; position: absolute; top: 0; left: 50px; right: 0;
  height: 1px; background: var(--line-2);
}
.lrow-ic {
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center; flex: 0 0 auto;
  background: var(--brand-tint); color: var(--brand-deep);
}
.lrow-ic svg { width: 22px; height: 22px; }
.lrow-main { flex: 1 1 auto; min-width: 0; }
.lrow-title { font-size: 15.5px; font-weight: 600; color: var(--ink); }
.lrow-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.lrow-chev { color: var(--ink-4); flex: 0 0 auto; }

/* App header (inner pages) */
.appbar {
  flex: 0 0 auto; height: 52px;
  display: flex; align-items: center;
  padding: 0 8px; gap: 4px;
  position: relative;
}
.appbar-title { font-size: 17px; font-weight: 800; letter-spacing:.3px; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; border: 0; background: none;
  cursor: pointer; color: var(--ink); flex: 0 0 auto;
}
.iconbtn:active { background: rgba(0,0,0,.05); }

/* number ticker font */
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Screen slide transition */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}
@keyframes slideIn {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}
@keyframes slideInBack {
  from { transform: translateX(-28%); filter: brightness(.92); }
  to   { transform: translateX(0); filter: none; }
}
@keyframes slideOut {
  from { transform: translateX(0); }
  to   { transform: translateX(100%); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes amtCaret {
  0%, 50% { opacity: 1; }
  50.01%, 100% { opacity: 0; }
}
/* tap-to-open numeric keypad sheet */
.pad-backdrop {
  position: absolute; inset: 0; z-index: 90;
  background: rgba(26,26,31,.22);
  opacity: 0; pointer-events: none; transition: opacity .26s ease;
}
.pad-backdrop.open { opacity: 1; pointer-events: auto; }
.pad-sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 100;
  background: #FCFCFA;
  border-top-left-radius: 22px; border-top-right-radius: 22px;
  box-shadow: 0 -10px 34px rgba(26,26,31,.16);
  transform: translateY(115%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
}
.pad-sheet.open { transform: translateY(0); }
.pad-sheet-grip { width: 38px; height: 4px; border-radius: 3px; background: var(--line); margin: 9px auto 2px; }
.anim-in   { animation: slideIn .3s cubic-bezier(.32,.72,0,1); }
.anim-back { animation: slideInBack .3s cubic-bezier(.32,.72,0,1); }
.anim-out  { animation: slideOut .28s cubic-bezier(.32,.72,0,1) forwards; box-shadow: -8px 0 24px rgba(0,0,0,.12); }

/* generic */
.muted { color: var(--ink-3); }
.center { text-align: center; }
.stack { display:flex; flex-direction:column; }

:root { --font-zh: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; --font-num: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
.lite-sb { flex: 0 0 auto; height: max(10px, env(safe-area-inset-top)); }
.toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: #144419; color: #FCFCFA; padding: 10px 16px; border-radius: 300px; font-size: 14px; z-index: 500; white-space: nowrap; }

/* ===== AI 理財助理 ===== */
.ai-fab { position: absolute; right: 16px; bottom: 100px; z-index: 46; border: 0; background: none; padding: 0;
  display: flex; align-items: center; gap: 8px; cursor: pointer; animation: fadeUp .35s both; }
.ai-fab-tip { background: #fff; color: var(--brand-deep); font-size: 12.5px; font-weight: 700; padding: 7px 11px;
  border-radius: 999px; box-shadow: var(--sh-2); white-space: nowrap; }
.ai-fab-btn { position: relative; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(145deg, #F97316, var(--brand-deep)); box-shadow: var(--sh-brand); }
.ai-fab:active .ai-fab-btn { transform: scale(.95); }
.ai-fab-badge { position: absolute; top: -3px; right: -3px; background: #1A1A1F; color: #fff; font-family: var(--font-num);
  font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 999px; border: 2px solid #fff; }

.ai-screen { background: #F4F3F0; }
.ai-scroll { flex: 1 1 auto; overflow-y: auto; padding: 8px 14px 20px; overscroll-behavior: contain; }
.ai-scroll::-webkit-scrollbar { width: 0; }
.ai-day { text-align: center; font-size: 12px; color: var(--ink-3); margin: 6px 0 14px; }
.ai-row { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 14px; animation: fadeUp .25s both; }
.ai-row.me { justify-content: flex-end; }
.ai-col { flex: 1; min-width: 0; max-width: 300px; }
.ai-avatar { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(145deg, #F97316, var(--brand-deep)); }
.ai-bubble { background: #fff; border-radius: 18px; border-top-left-radius: 6px; padding: 12px 14px;
  font-size: 15px; line-height: 1.6; color: var(--ink); white-space: pre-line; box-shadow: var(--sh-1); display: inline-block; max-width: 100%; }
.ai-bubble.me { background: var(--brand-tint-2); border-radius: 18px; border-top-right-radius: 6px; max-width: 260px; }
.ai-note { margin-top: 6px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.ai-time { font-size: 11px; color: var(--ink-4); margin-top: 5px; }
.ai-time.r { text-align: right; }
.ai-typing { display: flex; gap: 5px; padding: 15px 16px; }
.ai-typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); animation: aiDot 1s infinite; }
.ai-typing i:nth-child(2) { animation-delay: .15s; } .ai-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes aiDot { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

.ai-chips { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 10px; }
.ai-chip { border: 0; cursor: pointer; background: var(--brand-tint); color: var(--brand-deep); font-family: var(--font-zh);
  font-weight: 700; font-size: 15px; padding: 10px 18px; border-radius: 999px; text-align: left; }
.ai-chip.hl { background: var(--brand); color: #fff; box-shadow: var(--sh-brand); }
.ai-chip:active { transform: scale(.97); }
.ai-chip:disabled { opacity: .5; }

.ai-card { background: #fff; border-radius: 18px; padding: 14px 15px; box-shadow: var(--sh-1); position: relative; }
.ai-card-title { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; margin-bottom: 8px; }
.ai-ev-list { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
.ai-ev-list li { margin-bottom: 4px; } .ai-ev-list b { color: var(--ink); }
.ai-chart-cap { font-size: 12px; color: var(--ink-3); margin: 10px 0 6px; font-weight: 600; }
.ai-bars { display: flex; flex-direction: column; gap: 6px; }
.ai-bar-row { display: grid; grid-template-columns: 52px 1fr 70px; align-items: center; gap: 6px; font-size: 12px; }
.ai-bar-lab { color: var(--ink-2); }
.ai-bar-track { height: 10px; background: var(--line-2); border-radius: 6px; overflow: hidden; }
.ai-bar-fill { height: 100%; background: var(--brand); border-radius: 6px; }
.ai-bar-val { text-align: right; color: var(--ink); font-weight: 600; }
.ai-foot { font-size: 11.5px; color: var(--ink-3); margin-top: 10px; }

.ai-ptag { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 700; color: var(--brand-deep);
  background: var(--brand-tint); padding: 3px 8px; border-radius: 999px; }
.ai-pname { font-size: 16.5px; font-weight: 800; padding-right: 64px; line-height: 1.4; }
.ai-rr { display: inline-block; margin: 6px 0 8px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.ai-pgrid { border-top: 1px solid var(--line-2); }
.ai-prow { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; line-height: 1.5; }
.ai-prow span:first-child { color: var(--ink-3); } .ai-prow span:last-child { color: var(--ink); }
.ai-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.ai-stats div { background: var(--bg); border-radius: 12px; padding: 8px 10px; }
.ai-stats small { display: block; font-size: 11.5px; color: var(--ink-3); }
.ai-stats b { font-size: 15px; white-space: nowrap; }

.ai-inputbar { flex: 0 0 auto; display: flex; justify-content: center; gap: 46px; padding: 12px 0 30px; }
.ai-inbtn { width: 56px; height: 56px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--sh-1); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.ai-inbtn.mic { color: var(--brand-deep); box-shadow: 0 0 0 3px var(--brand-tint-2), var(--sh-1); }

.ai-sheet { max-height: 78%; display: flex; flex-direction: column; }
.ai-sheet-head { display: flex; align-items: center; justify-content: center; position: relative; padding: 14px; font-weight: 700; font-size: 16px; border-bottom: 1px solid var(--line); }
.ai-sheet-head .iconbtn { position: absolute; right: 8px; font-size: 18px; color: var(--ink-3); }
.ai-sheet-body { overflow-y: auto; padding: 4px 18px 30px; }
.ai-sheet-sec { padding: 14px 0; border-bottom: 1px solid var(--line-2); }
.ai-sheet-t { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
.ai-sheet-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-sheet-chips .ai-chip { font-size: 14px; padding: 9px 15px; }

.ai-dots { display: flex; justify-content: center; gap: 14px; margin: 18px 0; }
.ai-dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink-4); }
.ai-dots i.on { background: var(--ink); border-color: var(--ink); }
.ai-keys { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 12px 30px; }
.ai-keys button { height: 54px; border: 0; background: none; font-size: 24px; font-family: var(--font-num); cursor: pointer; border-radius: 12px; }
.ai-keys button:active { background: var(--line-2); }

.ai-end { position: absolute; inset: 0; z-index: 300; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; animation: fadeUp .3s both; }
.ai-end-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--success-tint); color: var(--success); font-size: 36px; font-weight: 800; display: grid; place-items: center; margin-bottom: 18px; }
.ai-end-t { font-size: 20px; font-weight: 800; margin-bottom: 18px; }
.ai-end-s { font-size: 15px; color: var(--ink-2); line-height: 1.6; }
.ai-end-code { font-size: 44px; font-weight: 800; color: var(--brand); letter-spacing: 4px; margin: 8px 0 14px; }

.ai-admin { position: absolute; inset: 0; z-index: 400; background: rgba(26,26,31,.4); display: grid; place-items: center; padding: 24px; }
.ai-admin-box { background: #fff; border-radius: 20px; padding: 20px; width: 100%; }
.ai-pnote { margin-top: 8px; font-size: 12.5px; font-weight: 600; color: #138A4E; background: #E6F4EC; border-radius: 10px; padding: 7px 10px; line-height: 1.5; }
.ai-pick { position: fixed; inset: 0; z-index: 99999; background: #F4F3F0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 24px; font-family: var(--font-zh, sans-serif); }
.ai-pick-t { font-size: 20px; font-weight: 800; text-align: center; color: #1A1A1F; }
.ai-pick-s { font-size: 13px; color: #6B6B73; text-align: center; margin-bottom: 8px; }
.ai-pick button { display: flex; align-items: center; gap: 14px; border: 0; background: #fff; border-radius: 14px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; font-family: inherit; text-align: left; }
.ai-pick button:active { transform: scale(.98); }
.ai-pick b { font-size: 22px; color: #EA580C; width: 40px; }
.ai-pick span { font-size: 15px; color: #1A1A1F; font-weight: 600; }
.ai-end-next { position: absolute; bottom: 40px; border: 0; background: none; color: #9A9AA2; font-size: 13px; text-decoration: underline; cursor: pointer; }

.ai-head { flex: 0 0 auto; }

/* ===== 視覺版本 D：森林綠 × 草綠（無漸層、無品牌名、無陰影） ===== */
:root {
  --brand:        #144419;
  --brand-deep:   #144419;
  --brand-press:  #0F3317;
  --brand-tint:   #F1F5EC;
  --brand-tint-2: #F1F5EC;
  --lime:         #A8E665;
  --lime-deep:    #86C94B;
  --accent:       #F7821B;

  --ink:    #17321D;
  --ink-2:  #4B5A4D;
  --ink-3:  #87948A;
  --ink-4:  #B6C1B7;

  --bg:     #FCFCFA;
  --card:   #F1F5EC;
  --line:   #F1F5EC;
  --line-2: #F1F5EC;

  --r-card: 24px;
  --r-md:   18px;
  --r-sm:   14px;
  --r-btn:  14px;

  --sh-1: none;
  --sh-2: none;
  --sh-3: none;
  --sh-brand: none;
}
body { background: #EEF0E8; }

/* 列表列原本是白底，改成跟卡片一樣的淺灰 */
.lrow { background: var(--card); }
.lrow:active { background: #F1F5EC; }
.lrow + .lrow::before { background: #FCFCFA; }
.lrow-ic { background: #FCFCFA; color: var(--ink); border-radius: 50%; }

/* 浮動膠囊導覽列（黑） */
.tabbar {
  left: 18px !important; right: 18px !important; bottom: 22px !important;
  height: 64px; padding: 7px; border: 0; border-radius: 999px;
  background: #144419; backdrop-filter: none; box-shadow: none; gap: 4px;
}
.tab { color: #9DB59F; border-radius: 999px; font-size: 10.5px; gap: 2px; }
.tab.active { color: #FCFCFA; background: none; }
.tab svg { width: 22px; height: 22px; }
.root-base .screen-scroll { padding-bottom: 110px; }

/* 按鈕 */
.btn-primary { background: #144419; color: #FCFCFA; height: 56px; box-shadow: none; }
.btn-primary:disabled { background: #C8D2C2; }
.btn-line { border-color: #F1F5EC; }

#sv .sv-dot:active { transform: scale(.94); }
#sv .sv-in { height: auto; padding: 10px 20px; line-height: 1.5; }
.ai-pick { background: #F1F5EC !important; }
.ai-pick button { background: #FCFCFA !important; border: 0 !important; border-radius: 300px !important; }

/* 研究版不使用功能選單 */
.ai-sheet:not(.open) { display: none !important; }

/* ===== AI 助理新形象（雲朵） ===== */
.bot { display: block; overflow: visible; }
.bot .e0, .bot .e1 { transform-box: view-box; transform-origin: 0 0; animation: 6s ease-in-out infinite; }
.bot .e0 { animation-name: botE0; } .bot .e1 { animation-name: botE1; }
.bot.think .e0, .bot.think .e1 { animation-duration: 2.6s; }
@keyframes botE0 { 0% { transform: matrix(0.86,-0.32,0.45,0.84,15.9,-30.3); } 14% { transform: matrix(0.86,-0.32,0.45,0.84,15.9,-30.3); } 16% { transform: matrix(0.86,-0.048,0.45,0.126,15.9,-30.3); } 18% { transform: matrix(0.86,-0.32,0.45,0.84,15.9,-30.3); } 36% { transform: matrix(0.86,-0.32,0.45,0.84,15.9,-30.3); } 44% { transform: matrix(0.86,0.32,-0.45,0.84,15.9,21.6); } 62% { transform: matrix(0.86,0.32,-0.45,0.84,15.9,21.6); } 64% { transform: matrix(0.86,0.048,-0.45,0.126,15.9,21.6); } 66% { transform: matrix(0.86,0.32,-0.45,0.84,15.9,21.6); } 80% { transform: matrix(0.86,0.32,-0.45,0.84,15.9,21.6); } 88% { transform: matrix(0.86,-0.32,0.45,0.84,15.9,-30.3); } 100% { transform: matrix(0.86,-0.32,0.45,0.84,15.9,-30.3); } }
@keyframes botE1 { 0% { transform: matrix(0.62,-0.05,0.45,0.84,51,-41.4); } 14% { transform: matrix(0.62,-0.05,0.45,0.84,51,-41.4); } 16% { transform: matrix(0.62,-0.0075,0.45,0.126,51,-41.4); } 18% { transform: matrix(0.62,-0.05,0.45,0.84,51,-41.4); } 36% { transform: matrix(0.62,-0.05,0.45,0.84,51,-41.4); } 44% { transform: matrix(0.62,0.05,-0.45,0.84,51,26.6); } 62% { transform: matrix(0.62,0.05,-0.45,0.84,51,26.6); } 64% { transform: matrix(0.62,0.0075,-0.45,0.126,51,26.6); } 66% { transform: matrix(0.62,0.05,-0.45,0.84,51,26.6); } 80% { transform: matrix(0.62,0.05,-0.45,0.84,51,26.6); } 88% { transform: matrix(0.62,-0.05,0.45,0.84,51,-41.4); } 100% { transform: matrix(0.62,-0.05,0.45,0.84,51,-41.4); } }
.ai-avatar.bot-av { background: none !important; width: 38px; height: 38px; border-radius: 0; }
.ai-avatar.bot-av svg { width: 100%; height: 100%; }
/* 查看剛才的推薦畫面：深綠底白字按鈕 */
#sv .sv-review { background: #144419 !important; color: #FCFCFA !important; text-decoration: none !important; padding: 7px 16px !important; border-radius: 300px !important; font-size: 13.5px !important; }

/* 情境框：#CFE2B5 底配深綠字 */
#sv .sv-quote { background: #CFE2B5 !important; color: #144419 !important; }
.ai-scenario { background: #CFE2B5 !important; color: #144419 !important; }
/* 查看剛才的推薦畫面：大小、字重、間距與區段小字相同 */
#sv .sv-review { font-size: 12.5px !important; font-weight: 700 !important; padding: 4px 10px !important; line-height: inherit; }

/* ===== 手機瀏覽器修正：鎖住整頁，不讓網頁本身捲動 =====
   iOS 的網址列會在捲動時收合、改變 100dvh，導致整頁跟著捲動：上方標題被推出畫面、下方露出空白遮罩。
   改成整頁固定，只讓聊天內容自己捲動。 */
html, body { height: 100%; overflow: hidden !important; overscroll-behavior: none; }
body { position: fixed; inset: 0; width: 100%; background: #F1F5EC !important; }
#root { height: 100%; }
@media (max-width: 479px), (max-height: 879px) {
  .phone { height: 100% !important; }
}
.ai-scroll { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

/* ===== 手機精簡版：聊天室改用整頁捲動（iOS 較順暢），標題與情境固定在上方 ===== */
@media (max-width: 479px), (max-height: 879px) {
  html, body { overflow: visible !important; height: auto !important; overscroll-behavior: auto !important; }
  body.lite { position: static !important; display: block !important; min-height: 100dvh; }
  body.lite #root, body.lite .phone { display: block !important; height: auto !important; min-height: 100dvh; overflow: visible !important; }
  body.lite .phone .ai-screen { position: relative !important; inset: auto !important; display: block !important; min-height: 100dvh; }
  body.lite .ai-head { position: sticky; top: 0; z-index: 30; background: #F1F5EC; padding-bottom: 4px; }
  body.lite .ai-scroll { overflow: visible !important; padding-bottom: calc(env(safe-area-inset-bottom) + 40px); }
  body.lite .pad-sheet, body.lite .pad-backdrop, body.lite .toast { position: fixed !important; }
}

    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 1800); return () => clearTimeout(t); }, [toast]);

    const add = (m) => { const id = idRef.current++; setMsgs(s => [...s, Object.assign({ id, time: nowLabel() }, m)]); return id; };
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    // bot says a sequence of messages with typing indicator; last one gets chips
    async function say(list, chipList, delay = 700) {
      busy.current = true; setChips(null);
      let lastId = null;
      for (const m of list) {
        setTyping(true); await wait(m.delay || delay); setTyping(false);
        lastId = add(Object.assign({ from: "bot" }, m));
        if (m.anchor) anchorRef.current = lastId;
        await wait(120);
      }
      if (chipList) setChips({ msgId: lastId, list: chipList });
      busy.current = false;
    }
    function me(text) { setChips(null); anchorRef.current = null; add({ from: "me", kind: "text", text }); }

    const MAIN_CHIPS = STUDY ? [{ label: "幫我推薦適合的理財方案", act: "rec", hl: true }] : [
      { label: "幫我推薦適合的理財方案", act: "rec", hl: true },
      { label: "帳戶餘額查詢", act: "bal" },
      { label: "查詢外幣匯率", act: "fx" },
      { label: "我要繳信用卡費", act: "cardpay" },
      { label: "查詢消費明細", act: "records" },
      { label: "看更多功能", act: "more" },
    ];

    function greet() {
      say([{ kind: "text", text: "您好，我是 AI 理財助理！我可以幫您查詢帳戶、辦理常用服務，也能依據您的需求提供理財建議。請問今天想了解什麼呢？", delay: 500 }], MAIN_CHIPS);
    }

    const linkChip = (label, go) => ({ label, act: "go", go });
    const backChips = [{ label: "幫我推薦適合的理財方案", act: "rec", hl: true }, { label: "看更多功能", act: "more" }];

    const logEv = (a) => { const L = logRef.current; (L.ev = L.ev || []).push(Math.round((Date.now() - startRef.current.getTime()) / 100) / 10 + "s " + a); };
    async function act(c) {
      if (busy.current) return;
      logEv(c.label || c.act);
      if (STUDY && c.act === "go") { setToast("研究版本僅開放 AI 理財助理"); return; }
      if (c.act === "more") { setSheet(true); return; }
      if (c.act === "go") { c.go(); return; }
      if (c.act === "otherAmt") { setAmtPad(""); return; }
      me(c.label);
      const card = D.cards[0];
      switch (c.act) {
        case "bal":
          return say([{ kind: "text", text: "以下是您的帳戶餘額：\n" + D.accounts.filter(a => a.balance > 0).map(a => `・${a.name}：NT$ ${fmt(a.balance)}`).join("\n") }],
            [linkChip("查看帳戶詳情", () => nav.push("accounts")), ...backChips]);
        case "fx": {
          const pick = D.fx.filter(f => ["USD", "JPY", "EUR"].includes(f.code));
          return say([{ kind: "text", text: `本行即期匯率（${D.fxQuoteTime}）：\n` + pick.map(f => `・${f.name} 買入 ${f.buy}／賣出 ${f.sell}`).join("\n") }],
            [linkChip("前往買外幣", () => nav.push("forex")), ...backChips]);
        }
        case "cardpay":
          return say([{ kind: "text", text: `您的${card.name}本期應繳 NT$ ${fmt(card.amount)}，最低應繳 NT$ ${fmt(card.minimum)}，繳款截止日 ${card.due}。` }],
            [linkChip("前往繳費", () => nav.push("card")), ...backChips]);
        case "records":
          return say([{ kind: "text", text: "您最近的交易：\n" + D.activity.slice(0, 3).map(a => `・${a.date} ${a.title} ${a.amount > 0 ? "+" : "−"}NT$ ${fmt(Math.abs(a.amount))}`).join("\n") }],
            [linkChip("查看完整明細", () => nav.push("records")), ...backChips]);
        case "card2":
          return say([{ kind: "text", text: `您的${card.name}可用額度為 NT$ ${fmt(card.available)}（信用額度 NT$ ${fmt(card.creditLimit)}）。` }], backChips);
        case "prep":
          return say([{ kind: "text", text: "投資前建議先做好三件事：\n1. 預留 3–6 個月的生活預備金\n2. 了解自己的風險承受度\n3. 詳閱商品公開說明書與費用" }], backChips);
        case "na":
          return say([{ kind: "text", text: "這項服務目前尚未開放於 AI 理財助理，請點選其他選項，或前往「服務」頁面辦理。" }], backChips);

        // ===== 理財推薦（實驗流程）=====
        case "rec":
          return say([{ kind: "text", text: "為了提供建議，我需要參考您在本行的帳戶與基本資料（如年齡、收入、存款與交易紀錄），請問是否同意？", note: "您可隨時於「設定」中取消授權。" }],
            [{ label: "同意", act: "consent" }, { label: "不同意", act: "deny" }]);
        case "deny":
          logRef.current.consent = "不同意";
          return say([{ kind: "text", text: "了解。未取得您的授權，我無法依據您的資料提供個人化的理財建議。您可以隨時重新授權，或洽詢理財專員。" }],
            [{ label: "我同意授權", act: "consent" }, { label: "回到主選單", act: "menu" }]);
        case "menu":
          return say([{ kind: "text", text: "好的，請問還有什麼可以幫您？" }], MAIN_CHIPS);
        case "consent":
          logRef.current.consent = logRef.current.consent === "不同意" ? "先不同意後同意" : "同意";
          return say([{ kind: "text", text: "請問您每月預計投入多少金額？" }], [{ label: "每月 10,000 元", act: "amount", amt: 10000 }, { label: "其他金額", act: "otherAmt" }]);
        case "amount": {
          amtRef.current = c.amt || 10000;
          await say([{ kind: "text", text: "正在為您分析適合的方案…", delay: 500 }]);
          const text = E.msg + "\n" + P.risk + (E.tail ? "\n" + E.tail : "");
          await say([{ kind: "text", text, delay: 2000 }],
            [E.items ? { label: "查看推薦依據", act: "showEv" } : { label: "查看推薦商品", act: "showProd" }]);
          logRef.current.msgAt = Date.now();
          return;
        }
        case "showEv":
          logRef.current.evClickAt = Date.now();
          await say([{ kind: "evidence", delay: 900, anchor: true }], [{ label: "查看推薦商品", act: "showProd" }]);
          logRef.current.evAt = Date.now();
          return;
        case "showProd":
          logRef.current.prodClickAt = Date.now();
          await say([
            { kind: "product", amt: amtRef.current, delay: 900, anchor: true },
            { kind: "text", text: `請問您要立即申購「${P.name}」嗎？`, note: "基金投資有風險，過去績效不代表未來表現，投資前請詳閱公開說明書。", delay: 900 },
          ], [{ label: "立即申購", act: "buy" }, { label: "暫時不要", act: "skip" }]);
          logRef.current.recAt = Date.now();
          return;
        case "buy":
          logRef.current.decision = "立即申購"; logRef.current.decAt = Date.now();
          return say([{ kind: "text", text: "請選擇每月扣款日" }],
            [6, 16, 26].map(d => ({ label: d + " 日", act: "day", day: d })));
        case "day":
          logRef.current.detail = "扣款日 " + c.day + " 日";
          setState(s => Object.assign({}, s, { day: c.day }));
          return say([{ kind: "confirm", day: c.day, amt: amtRef.current }]);
        case "skip":
          logRef.current.decision = "暫時不要"; logRef.current.decAt = Date.now();
          return say([{ kind: "text", text: "好的。可以告訴我原因嗎？" }],
            ["想再考慮", "金額太高", "風險太高", "報酬不夠吸引人", "不了解這個商品", "不信任 AI 的推薦", "想先問真人理專", "目前不需要"].map(l => ({ label: l, act: "reason" })));
        case "reason":
          logRef.current.reason = c.label;
          return say([{ kind: "text", text: `了解。要將「${P.name}」加入追蹤清單，之後再決定嗎？` }],
            [{ label: "加入追蹤", act: "track" }, { label: "不用了", act: "track" }]);
        case "track":
          logRef.current.detail = c.label;
          return say([{ kind: "text", text: "好的，已為您記錄。有需要隨時找我。" }], [{ label: "完成", act: "finish" }]);
        case "finish": {
          const L = logRef.current;
          const sec = (a, b) => a && b ? Math.round((b - a) / 100) / 10 : "";
          if (STUDY && !L.sent && window.__study) {
            L.sent = true;
            const sc = document.querySelector(".ai-scroll");
            let html = "";
            if (sc) { const c2 = sc.cloneNode(true); c2.querySelectorAll(".ai-chips,.ai-typing").forEach(x => x.remove()); html = c2.innerHTML; }
            window.__study.protoDone({
              "原型_開始時間": stamp(startRef.current), "原型_授權": L.consent, "原型_投入金額": amtRef.current,
              "原型_申購決定": L.decision, "原型_不申購原因": L.reason, "原型_扣款日或追蹤": L.detail,
              "原型_看推薦訊息秒數": sec(L.msgAt, L.evClickAt || L.prodClickAt),
              "原型_看推薦依據秒數": sec(L.evAt, L.evClickAt ? L.prodClickAt : null),
              "原型_看商品卡秒數": sec(L.recAt, L.decAt),
              "原型_總操作秒數": sec(startRef.current.getTime(), Date.now()),
              "原型_操作紀錄": (L.ev || []).join(" | "),
            }, html);
            return;
          }
          if (!L.sent) {
            L.sent = true;
            sendLog({
              version, startTime: stamp(startRef.current), consent: L.consent, amount: amtRef.current,
              decision: L.decision, reason: L.reason, detail: L.detail,
              recSeconds: L.recAt && L.decAt ? Math.round((L.decAt - L.recAt) / 1000) : "",
              totalSeconds: Math.round((Date.now() - startRef.current.getTime()) / 1000),
            });
          }
          await wait(400); setEnded(true); return;
        }
        default:
          return say([{ kind: "text", text: "這項服務目前尚未開放於 AI 理財助理，請點選其他選項。" }], backChips);
      }
    }

    function confirmBuy() {
      if (state.confirmed) return;
      setState(s => Object.assign({}, s, { confirmed: true }));
      setPwd("");
    }
    async function pwdKey(k) {
      const v = (pwd + k).slice(0, 6); setPwd(v);
      if (v.length === 6) {
        await wait(350); setPwd(null);
        await say([{ kind: "text", text: `申購完成！「${P.name}」每月 ${state.day} 日將自動扣款 ${fmt(amtRef.current)} 元。`, delay: 900 }], [{ label: "完成", act: "finish" }]);
      }
    }

    function titleTap() {
      const t = Date.now(); taps.current = taps.current.filter(x => t - x < 700).concat(t);
      if (taps.current.length >= 3) { taps.current = []; setAdmin(true); }
    }

    // ---- render a message ----
    function renderMsg(m) {
      if (m.from === "me") return h("div", { key: m.id, className: "ai-row me" },
        h("div", null, h("div", { className: "ai-bubble me" }, m.text), h("div", { className: "ai-time r" }, m.time + " 送出")));
      let body;
      if (m.kind === "evidence") body = h(EvidenceCard, { e: E });
      else if (m.kind === "product") body = h(ProductCard, { p: P, amt: m.amt });
      else if (m.kind === "confirm") body = h(ConfirmCard, { p: P, day: m.day, amt: m.amt, onConfirm: confirmBuy, done: state.confirmed });
      else body = h("div", { className: "ai-bubble" }, m.text, m.note && h("div", { className: "ai-note" }, m.note));
      const myChips = chips && chips.msgId === m.id ? chips.list : null;
      return h("div", { key: m.id, className: "ai-row", "data-mid": m.id },
        h(Avatar), h("div", { className: "ai-col" }, body,
          myChips && h("div", { className: "ai-chips" }, myChips.map((c, i) =>
            h("button", { key: i, className: "ai-chip" + (c.hl ? " hl" : ""), onClick: () => act(c) }, c.label))),
          h("div", { className: "ai-time" }, m.time + " 送出")));
    }

    const SHEET = [
      ["熱門功能", [["幫我推薦適合的理財方案", "rec"], ["帳戶餘額查詢", "bal"], ["我要繳信用卡費", "cardpay"], ["查詢消費明細", "records"]]],
      ["理財服務", [["幫我推薦適合的理財方案", "rec"], ["投資前的準備", "prep"], ["我的基金", "go:wealth"]]],
      ["銀行服務", [["帳戶餘額查詢", "bal"], ["外幣匯率", "fx"], ["換匯試算", "go:forex"], ["查詢我的 VIP", "na"]]],
      ["信用卡服務", [["我要繳信用卡費", "cardpay"], ["查詢可用額度", "card2"], ["辦理分期", "na"], ["電子帳單", "go:card"]]],
      ["服務據點", [["找分行・ATM", "go:branches"]]],
    ];
    function sheetPick(label, code) {
      setSheet(false);
      if (code.startsWith("go:") && STUDY) { setToast("研究版本僅開放 AI 理財助理"); return; }
      if (code.startsWith("go:")) {
        const r = code.slice(3);
        if (r === "wealth") nav.tab("wealth"); else nav.push(r);
        return;
      }
      act({ label, act: code });
    }

    return h("div", { className: "screen ai-screen" },
      h("div", { className: "ai-head" },
      h(StatusBar),
      h("div", { className: "appbar" },
        STUDY ? h("span", { style: { width: 40 } }) : h("button", { className: "iconbtn", onClick: () => nav.pop(), "aria-label": "返回" }, h(Icon.chevL, { style: { width: 24, height: 24 } })),
        h("div", { className: "appbar-title", style: { flex: 1, textAlign: "center" }, onClick: titleTap }, "AI 理財助理"),
        STUDY ? h("span", { style: { width: 40 } }) : h("button", { className: "iconbtn", "aria-label": "更多", onClick: () => setSheet(true) },
          h("svg", { viewBox: "0 0 24 24", width: 22, height: 22, fill: "currentColor" },
            h("circle", { cx: 12, cy: 5, r: 1.8 }), h("circle", { cx: 12, cy: 12, r: 1.8 }), h("circle", { cx: 12, cy: 19, r: 1.8 })))),
      STUDY && h("div", { className: "ai-scenario" }, h("b", null, "情境"), "你是一位 25 歲的上班族、月收入約 5 萬、每月結餘約 2 萬、活存約 18 萬，想每月定期定額投資 10,000 元。")),
      h("div", { className: "ai-scroll", ref: scRef },
        h("div", { className: "ai-day" }, "今天"),
        msgs.map(renderMsg),
        typing && h("div", { className: "ai-row" }, h(Avatar, { think: true }), h("div", { className: "ai-bubble ai-typing" }, h("i"), h("i"), h("i")))),
      h("div", { className: "ai-inputbar" },
        h("button", { className: "ai-inbtn", onClick: () => setToast("請點選畫面中的選項") },
          h("svg", { viewBox: "0 0 24 24", width: 26, height: 26, fill: "none", stroke: "currentColor", strokeWidth: 1.8 },
            h("rect", { x: 3, y: 6, width: 18, height: 12, rx: 2 }), h("path", { d: "M7 10h.01M10 10h.01M13 10h.01M16 10h.01M8 14h8", strokeLinecap: "round" }))),
        h("button", { className: "ai-inbtn mic", onClick: () => setToast("請點選畫面中的選項") },
          h("svg", { viewBox: "0 0 24 24", width: 26, height: 26, fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round" },
            h("rect", { x: 9, y: 3, width: 6, height: 11, rx: 3, fill: "#E4EADB" }), h("path", { d: "M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" })))),

      // 功能選單
      h("div", { className: "pad-backdrop" + (sheet ? " open" : ""), onClick: () => setSheet(false) }),
      h("div", { className: "pad-sheet ai-sheet" + (sheet ? " open" : "") },
        h("div", { className: "ai-sheet-head" }, "功能選單", h("button", { className: "iconbtn", onClick: () => setSheet(false), "aria-label": "關閉" }, "✕")),
        h("div", { className: "ai-sheet-body" }, SHEET.map(([t, items], i) =>
          h("div", { key: i, className: "ai-sheet-sec" },
            h("div", { className: "ai-sheet-t" }, t),
            h("div", { className: "ai-sheet-chips" }, items.map(([l, code], j) =>
              h("button", { key: j, className: "ai-chip", disabled: busy.current, onClick: () => sheetPick(l, code) }, l))))))),

      // 交易密碼
      pwd !== null && h("div", { className: "pad-backdrop open" }),
      pwd !== null && h("div", { className: "pad-sheet open" },
        h("div", { className: "pad-sheet-grip" }),
        h("div", { style: { textAlign: "center", padding: "10px 0 4px", fontWeight: 800, fontSize: 17 } }, "請輸入交易密碼"),
        h("div", { style: { textAlign: "center", fontSize: 12.5, color: "var(--ink-3)" } }, "（體驗版：輸入任意 6 碼）"),
        h("div", { className: "ai-dots" }, [0, 1, 2, 3, 4, 5].map(i => h("i", { key: i, className: i < pwd.length ? "on" : "" }))),
        h("div", { className: "ai-keys" }, ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map((k, i) =>
          h("button", { key: i, disabled: !k, onClick: () => k === "⌫" ? setPwd(p => p.slice(0, -1)) : pwdKey(k) }, k)))),

      // 其他金額輸入
      amtPad !== null && h("div", { className: "pad-backdrop open", onClick: () => setAmtPad(null) }),
      amtPad !== null && h("div", { className: "pad-sheet open" },
        h("div", { className: "pad-sheet-grip" }),
        h("div", { style: { textAlign: "center", padding: "10px 0 2px", fontWeight: 800, fontSize: 17 } }, "請輸入每月投入金額"),
        h("div", { style: { textAlign: "center", fontSize: 12.5, color: "var(--ink-3)" } }, "最低 1,000 元"),
        h("div", { className: "num", style: { textAlign: "center", fontSize: 34, fontWeight: 700, margin: "14px 0 10px", color: amtPad ? "var(--ink)" : "var(--ink-4)" } }, "NT$ " + (amtPad ? fmt(amtPad) : "0")),
        h("div", { className: "ai-keys", style: { paddingBottom: 8 } }, ["1", "2", "3", "4", "5", "6", "7", "8", "9", "00", "0", "⌫"].map((k, i) =>
          h("button", { key: i, onClick: () => setAmtPad(v => k === "⌫" ? v.slice(0, -1) : (v + k).replace(/^0+/, "").slice(0, 7)) }, k))),
        h("div", { style: { padding: "0 20px 30px" } },
          h("button", { className: "btn btn-primary", disabled: !amtPad, onClick: () => {
            const v = parseInt(amtPad || "0", 10);
            if (v < 1000) { setToast("最低投入金額為 1,000 元"); return; }
            setAmtPad(null); act({ label: "每月 " + fmt(v) + " 元", act: "amount", amt: v });
          } }, "確認"))),

      toast && h(window.Toast, { text: toast }),

      // 結束頁
      ended && h("div", { className: "ai-end" },
        h("div", { className: "ai-end-icon" }, "✓"),
        h("div", { className: "ai-end-t" }, "體驗結束，感謝您的參與！"),
        h("div", { className: "ai-end-s" }, "請回到問卷，繼續作答。"),
        !FORCED && h("button", { className: "ai-end-next", onClick: () => location.replace(location.pathname) }, "下一位受試者（研究人員用）")),

      // 研究者選單（連點三下標題）
      admin && h("div", { className: "ai-admin" },
        h("div", { className: "ai-admin-box" },
          h("b", null, "研究者設定"),
          h("div", { style: { fontSize: 13, color: "var(--ink-3)", margin: "4px 0 10px" } }, "目前版本：" + version),
          h("div", { className: "ai-sheet-chips" }, VERSIONS.map(v =>
            h("button", { key: v, className: "ai-chip" + (v === version ? " hl" : ""), onClick: () => { setVersion(v); setAdmin(false); nav.pop(); } }, v))),
          h("div", { style: { fontSize: 12, color: "var(--ink-3)", marginTop: 8 } }, "選擇後會關閉聊天室，重新開啟即套用新版本。"),
          h("button", { className: "btn btn-line", style: { height: 42, fontSize: 15, marginTop: 12 }, onClick: () => setAdmin(false) }, "關閉")))
    );
  }

  window.AIChat = AIChat;
  window.AIFab = AIFab;
  window.__AI = { EXPLAIN, PRODUCTS, EvidenceCard, ProductCard, Avatar, getVersion, LOG_URL, stamp, STUDY };
})();
</script>
<script>/* ===== 問卷整合版：問卷 → 操作原型 → 問卷，全部在同一個網頁 =====
   資料：每位受試者送出一列到 Google Sheet（整合資料分頁）；聯絡方式另存（聯絡方式分頁）。 */
(function () {

        '<label class="sv-lab">請問怎麼稱呼您？（例如：王小姐、阿明）</label><input class="sv-in" data-k="Q40" value="' + esc(a.Q40 || "") + '">' +
        '<label class="sv-lab">偏好的聯絡方式</label>' + opts({ k: "Q41", o: ["Email", "LINE", "手機"] }) +
        '<label class="sv-lab">請填寫您的 Email、LINE ID 或手機號碼</label><input class="sv-in" data-k="Q42" value="' + esc(a.Q42 || "") + '">';
      const chk = () => { f.querySelector(".sv-next").disabled = !(a.Q40 && a.Q40.trim() && a.Q41 && a.Q42 && a.Q42.trim()); };
      nextBtn("送出問卷", false);
      b.querySelectorAll(".sv-in").forEach(el => el.oninput = () => { a[el.dataset.k] = el.value; chk(); });
      b.querySelectorAll('.sv-opts[data-k="Q41"] .sv-opt').forEach(el => el.onclick = () => {
        a.Q41 = el.dataset.o; b.querySelectorAll('.sv-opts[data-k="Q41"] .sv-opt').forEach(x => x.classList.toggle("on", x === el)); chk(); });
      chk();
    }
    // 最後一頁的按鈕文字
    if (p.type === "single" && p.q.k === "Q39") f.innerHTML = "";
    const rv = b.querySelector(".sv-review"); if (rv) rv.onclick = openReview;
  }

  function opts(q) {
    return '<div class="sv-opts" data-k="' + q.k + '">' + q.o.map(o => '<button class="sv-opt' + (S.a[q.k] === o ? " on" : "") + '" data-o="' + esc(o) + '">' + esc(o) + "</button>").join("") + "</div>";
  }
  function bindSingle(p) {
    body().querySelectorAll(".sv-opt").forEach(el => el.onclick = () => {
      S.a[p.q.k] = el.dataset.o;
      body().querySelectorAll(".sv-opt").forEach(x => x.classList.toggle("on", x === el));
      setTimeout(() => {
        const stop = p.q.stop && p.q.stop[el.dataset.o];
        if (stop) { S.status = stop; return submit(); }
        if (p.q.k === "Q39" && el.dataset.o === "不願意") return submit();
        next();
      }, 260);
    });
  }
  function scale(k, t, lab) {
    const v = S.a[k];
    return '<div class="sv-item' + (v ? " ok" : "") + '" data-k="' + k + '"><div class="sv-it">' + esc(t) + '</div><div class="sv-scale">' +
      [1, 2, 3, 4, 5, 6, 7].map(n => '<button class="sv-dot' + (v === n ? " on" : "") + '" data-n="' + n + '">' + n + "</button>").join("") +
      '</div><div class="sv-anch"><span>' + esc(lab[0]) + "</span><span>" + esc(lab[1]) + "</span></div></div>";
  }
  let needKeys = [];
  function markScaleState() {
    const done = needKeys.every(k => S.a[k] != null && S.a[k] !== "");
    const btn = foot().querySelector(".sv-next"); if (btn) btn.disabled = !done;
    body().querySelectorAll('.sv-opts[data-k="Q37"] .sv-opt').forEach(x => x.classList.toggle("on", x.dataset.o === S.a.Q37));
  }
  function bindScale(p, keys) {
    needKeys = keys;
    foot().innerHTML = '<button class="sv-next" disabled>下一頁</button>';
    foot().querySelector(".sv-next").onclick = () => { if (!foot().querySelector(".sv-next").disabled) next(); };
    body().querySelectorAll(".sv-item").forEach(item => item.querySelectorAll(".sv-dot").forEach(d => d.onclick = () => {
      S.a[item.dataset.k] = +d.dataset.n;
      item.querySelectorAll(".sv-dot").forEach(x => x.classList.toggle("on", x === d));
      item.classList.add("ok");
      const nx = [...body().querySelectorAll(".sv-item")].find(x => !x.classList.contains("ok"));
      if (nx) setTimeout(() => nx.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
      markScaleState();
    }));
    markScaleState();
  }

  // ---------- 三種設計（用原型的同一套元件畫出來） ----------
  function drawDesigns(b) {
    const h = React.createElement, risk = AI.PRODUCTS[V[1]].risk;
    b.querySelectorAll(".sv-design").forEach(d => {
      const E = AI.EXPLAIN[d.dataset.e];
      const text = E.msg + "\n" + risk + (E.tail ? "\n" + E.tail : "");
      const el = d.querySelector(".sv-dm");
      const row = (key, child) => h("div", { key, className: "ai-row" }, h(AI.Avatar), h("div", { className: "ai-col" }, child));
      ReactDOM.createRoot(el).render(h("div", { className: "ai-screen sv-mini" },
        row(1, h("div", { className: "ai-bubble" }, text)),
        E.items ? row(2, h(AI.EvidenceCard, { e: E })) : null));
    });
  }

  // ---------- 原型階段 ----------
  function startProto() {
    leave(); S.enter = null;
    S.hist = []; // 操作後不能回到操作前
    document.body.classList.add("study-op");
    if (window.__openChat) { window.__openChat(); setTimeout(() => root.classList.add("hide"), 60); }   // 精簡版：直接掛上聊天室
    else { const fab = document.querySelector(".ai-fab"); if (fab) fab.click(); setTimeout(() => root.classList.add("hide"), 450); }
    S.protoStart = Date.now();
  }
  window.__study = {
    protoDone(data, transcript) {
      S.proto = data; S.transcript = transcript;
      document.body.classList.remove("study-op");
      const tip = document.querySelector(".sv-optip"); if (tip) tip.remove();
      setTimeout(() => { root.classList.remove("hide"); go(REVIEW_FROM, false); S.hist = []; }, 500);
    },
  };

  // ---------- 回看操作內容 ----------
  function openReview() {
    S.reviews++;
    const m = document.createElement("div");
    m.className = "sv-modal";
    m.innerHTML = '<div class="sv-mhead">剛才的推薦畫面<button class="sv-mclose">返回問卷</button></div><div class="sv-mbody"><div class="ai-screen sv-mini"></div></div>';
    // 只保留推薦訊息 → 推薦依據 → 商品卡
    const tmp = document.createElement("div"); tmp.innerHTML = S.transcript;
    const rows = [...tmp.querySelectorAll(".ai-row")];
    const a = rows.findIndex(r => /推薦以下商品/.test(r.textContent));
    const z = rows.findIndex(r => r.querySelector(".ai-pname"));
    const keep = a >= 0 && z >= a ? rows.slice(a, z + 1).filter(r => !r.classList.contains("me")) : rows;
    const box = m.querySelector(".sv-mini");
    keep.forEach(r => box.appendChild(r));
    m.querySelector(".sv-mclose").onclick = () => m.remove();
    root.querySelector(".sv-wrap").appendChild(m);
  }

  // ---------- 送出 ----------
  const QKEY = "study_queue_v1";
  function queue() { try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch (e) { return []; } }
  function saveQ(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
  async function flush() {
    let q = queue();
    for (const item of q.slice()) {
      try {
        await fetch(AI.LOG_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(item) });
        q = q.filter(x => x._id !== item._id); saveQ(q);
      } catch (e) { break; }
    }
  }
  function enqueue(obj) { obj._id = Date.now() + "_" + Math.random().toString(36).slice(2, 7); const q = queue(); q.push(obj); saveQ(q); }

  function submit() {
    leave();
    const a = S.a, row = { type: "study" };
    const EXP = { A: "A 無解釋", B: "B 行為邏輯解釋", C: "C 相似族群解釋" }[V[0]];
    Object.assign(row, {
      "開始時間": AI.stamp(S.start), "送出時間": AI.stamp(new Date()), "版本": V, "解釋類型": EXP, "風險": V[1] === "1" ? "低風險" : "高風險",
      "狀態": S.status, "總作答秒數": Math.round((Date.now() - S.start.getTime()) / 1000),
    });
    for (let n = 1; n <= 39; n++) {
      const k = "Q" + n;
      if (n === 10) GRID_ROWS.forEach((r, i) => row["Q10_" + r] = a["Q10_" + (i + 1)] ?? "");
      else if (n === 36) RANK_ITEMS.forEach(o => { const r = (a._rank || []).indexOf(o); row["Q36_" + o + "（名次）"] = r >= 0 ? r + 1 : ""; });
      else row[k] = Array.isArray(a[k]) ? a[k].join("、") : (a[k] ?? "");
    }
    row["Q27_注意力檢核通過"] = a.Q27 == null ? "" : (a.Q27 === 3 ? "是" : "否");
    const proto = S.proto || {};
    ["原型_開始時間", "原型_授權", "原型_投入金額", "原型_申購決定", "原型_不申購原因", "原型_扣款日或追蹤",
      "原型_看推薦訊息秒數", "原型_看推薦依據秒數", "原型_看商品卡秒數", "原型_總操作秒數", "原型_操作紀錄"].forEach(k => row[k] = proto[k] ?? "");
    row["回看操作次數"] = S.reviews;
    P.forEach(p => row["秒數_" + p.id] = S.t[p.id] ? Math.round(S.t[p.id] * 10) / 10 : "");
    enqueue(row);
    if (a.Q39 === "願意" && a.Q42) enqueue({ type: "contact", "時間": AI.stamp(new Date()).slice(0, 10), "稱呼": a.Q40 || "", "聯絡方式": a.Q41 || "", "帳號或號碼": a.Q42 || "" });
    flush();
    thanks();
  }

  function thanks() {
    root.querySelector(".sv-top").style.visibility = "hidden"; root.querySelector(".sv-back").style.visibility = "hidden";
    const end = S.status !== "完成";
    body().innerHTML = '<div class="sv-done"><div class="sv-done-ic">✓</div><div class="sv-title">' + (end ? "感謝您的協助" : "問卷填答完成，非常感謝您的參與！") + '</div><div class="sv-text">' +
      (end ? "<p>" + (S.status === "不符資格" ? "很抱歉，您不符合本研究的填答條件。" : "您選擇不參與本研究。") + "感謝您撥空協助！</p>"
        : "<p>您剛才操作的銀行 App 和 AI 理財助理是研究用的模擬畫面，其中的銀行、商品與數據都是虛構的，不是真實的投資建議。</p><p>您的填答內容以匿名方式保存，僅供本研究分析使用。" +
          (S.a.Q39 === "願意" ? "我們會在後續研究開始時與您聯繫，感謝您願意持續協助！" : "") + "</p>") +
      '<p class="sv-sign">國立臺灣科技大學設計系碩士班<br>研究生 張媛婷　敬上<br>指導教授 陳建雄</p></div></div>';
    foot().innerHTML = "";
  }

  function boot() { document.body.appendChild(root); render(); flush(); }
  if (document.body) boot(); else document.addEventListener("DOMContentLoaded", boot);
})();
</script>
<script>
(function () {
  const h = React.createElement;
  function App() {
    const [open, setOpen] = React.useState(false);
    window.__openChat = () => setOpen(true);
    return h("div", { className: "phone" }, open ? h(window.AIChat) : null);
  }
  document.body.classList.add("lite");
  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
